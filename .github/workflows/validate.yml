name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate plugin, skill, and golden cases
        run: python tests/validate_repository.py
      - name: Test macOS/Linux installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          install_root=$(mktemp -d)
          ./scripts/install-skill.sh --codex-root "$install_root/codex"
          test -f "$install_root/codex/hkdse-contentops/SKILL.md"
          if ./scripts/install-skill.sh --codex-root "$install_root/codex"; then
            echo "Non-force reinstall unexpectedly succeeded" >&2
            exit 1
          fi
          ./scripts/install-skill.sh --force --codex-root "$install_root/codex"
          ./scripts/install-skill.sh --force --codex-root "$install_root/codex"
          test "$(find "$install_root/codex" -maxdepth 1 -type d -name 'hkdse-contentops.backup-*' | wc -l | tr -d ' ')" -eq 2
          if ./scripts/install-skill.sh --codex-root '/.'; then
            echo "Filesystem-root alias unexpectedly succeeded" >&2
            exit 1
          fi
          if ./scripts/install-skill.sh --force \
            --codex-root "$GITHUB_WORKSPACE/plugins/hkdse-contentops/skills"; then
            echo "Source overwrite unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "hkdse-contentops-install"
          .\scripts\install-skill.ps1 -CodexRoot (Join-Path $installRoot "codex")
          if (-not (Test-Path (Join-Path $installRoot "codex\hkdse-contentops\SKILL.md"))) { throw "Codex install failed" }
          $NonForceSucceeded = $true
          try {
            .\scripts\install-skill.ps1 -CodexRoot (Join-Path $installRoot "codex")
          } catch {
            $NonForceSucceeded = $false
          }
          if ($NonForceSucceeded) { throw "Non-force reinstall unexpectedly succeeded" }
          1..2 | ForEach-Object {
            .\scripts\install-skill.ps1 -Force -CodexRoot (Join-Path $installRoot "codex")
          }
          $CodexBackups = @(Get-ChildItem (Join-Path $installRoot "codex") -Directory -Filter "hkdse-contentops.backup-*")
          if ($CodexBackups.Count -ne 2) { throw "Expected two distinct Codex backups" }
          $SourceOverwriteSucceeded = $true
          try {
            .\scripts\install-skill.ps1 -Force -CodexRoot (Join-Path $PWD "plugins\hkdse-contentops\skills")
          } catch {
            $SourceOverwriteSucceeded = $false
          }
          if ($SourceOverwriteSucceeded) { throw "Source overwrite unexpectedly succeeded" }
